# CodeQL · static security analysis.
#
# A branch-protection rule on this repo requires a check named `CodeQL`,
# but no workflow on the branch produced that check name — the protection
# was failing PRs with "1 configuration not found" in 2 seconds.
# This workflow declares the matrix expected by the protection rule and
# runs the official github/codeql-action against Python + JavaScript /
# TypeScript (covers aedi-sight-gui/ + the repo's JS scripts + dashboard).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan on a quiet hour so stale findings get refreshed even
    # when no PR is open.
    - cron: "23 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` is the broader suite; if it pulls too
          # many findings on the existing Python codebase we can fall
          # back to `security-extended` or the default `security` set.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
