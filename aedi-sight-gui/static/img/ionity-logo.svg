<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="IONITY · AEDi-Sight RuView">
  <defs>
    <linearGradient id="il-blue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0"   stop-color="#061a78"/>
      <stop offset="0.5" stop-color="#2057ff"/>
      <stop offset="1"   stop-color="#3a8bff"/>
    </linearGradient>
    <linearGradient id="il-white" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8d3e6"/>
    </linearGradient>
    <radialGradient id="il-puls" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#3a8bff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3a8bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="il-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Concentric rings — the IONITY "ripple" mark on the left -->
  <g transform="translate(100 100)" filter="url(#il-glow)">
    <circle r="78" fill="url(#il-puls)">
      <animate attributeName="r" values="60;82;60" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.0;0.6;0.0" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="64" fill="none" stroke="url(#il-blue)" stroke-width="3"/>
    <circle r="44" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.78"/>
    <circle r="22" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.55"/>
    <circle r="8"  fill="url(#il-white)"/>
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#ffffff" stroke-width="0.9" stroke-dasharray="2 4" opacity="0.5"/>
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#ffffff" stroke-width="0.9" stroke-dasharray="2 4" opacity="0.5"/>
  </g>

  <!-- Word mark + tagline -->
  <g font-family="-apple-system, 'Inter', 'Segoe UI', sans-serif">
    <text x="210" y="92" font-size="62" font-weight="700" letter-spacing="14" fill="url(#il-blue)">IONITY</text>
    <text x="210" y="120" font-size="14" letter-spacing="6"  fill="#ffffff" opacity="0.84">AEDi-SIGHT · RUVIEW</text>
    <text x="210" y="148" font-size="11" letter-spacing="4"  fill="#8a96aa">WIFI-CSI SENSING · ANTWERP DESIGNS · 2018 – 2026</text>
    <line  x1="210" y1="156" x2="700" y2="156" stroke="#3a8bff" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
